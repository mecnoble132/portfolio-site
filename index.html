<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clement Cruz Noble — Student Developer</title>
  <meta name="description" content="Portfolio of Clement Cruz Noble, a 15-year-old student developer building and shipping web apps. Selected projects, skills, and contact details.">
  <link rel="canonical" href="https://clementcruz.vercel.app/">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">

  <!-- Open Graph / Twitter (no preview image on purpose) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Clement Cruz Noble — Student Developer">
  <meta property="og:description" content="Selected projects, skills, resume, and contact details.">
  <meta property="og:url" content="https://clementcruz.vercel.app/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Clement Cruz Noble — Student Developer">
  <meta name="twitter:description" content="Selected projects, skills, resume, and contact details.">

  <script type="application/ld+json">
    { "@context": "https://schema.org", "@type": "Person", "name": "Clement Cruz Noble", "jobTitle": "Student Developer", "url": "https://clementcruz.vercel.app/" }
  </script>

  <script>
    // Theme before paint (no flash). "anim" turns on the animated experience unless motion is reduced.
    try {
      const t = localStorage.getItem("theme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = t;
    } catch (e) {}
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("anim");
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/home.css">

  <!-- Animation library (pinned versions, no build step). main.js falls back to a plain page if these fail to load. -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="grain" aria-hidden="true"></div>
  <div class="progress" aria-hidden="true"></div>

  <div class="preloader" aria-hidden="true">
    <span class="preloader__count">0</span>
    <span class="preloader__name" data-site="name"></span>
  </div>

  <header class="nav">
    <nav class="container nav__inner" aria-label="Main">
      <a class="nav__logo" href="#top" data-site="name"></a>
      <button id="menu-toggle" class="btn btn--icon nav__menu" type="button" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="nav__links" id="nav-links">
        <a href="#work">Work</a>
        <a href="projects.html">Projects</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
        <a class="btn btn--primary" href="assets/resume.pdf" download hidden>Resume</a> <!-- hidden for now: remove the "hidden" attribute to show -->

        <button id="theme-toggle" class="btn btn--icon" type="button" aria-label="Toggle dark mode" aria-pressed="false"></button>
      </div>
    </nav>
  </header>

  <main id="main">
    <section class="hero" id="top">
      <canvas class="hero__canvas" aria-hidden="true"></canvas>
      <div class="container hero__content">
        <div class="hero__text">
          <p class="hero__status"><span class="hero__dot" aria-hidden="true"></span><span data-site="status"></span></p>
          <h1 class="hero__title">
            <span class="hero__kicker">Hi, I'm</span>
            <span class="hero__name" data-site="name" data-split></span>
            <span class="hero__headline" data-site="headline" data-split></span>
          </h1>
          <p class="hero__pitch" data-site="pitch"></p>
          <div class="hero__actions">
            <a class="btn btn--primary btn--lg" href="#work" data-magnetic>View my work</a>
            <a class="btn btn--lg" href="projects.html" data-magnetic>Quick project list</a>
          </div>
          <dl class="hero__stats" id="hero-stats"></dl>
        </div>
        <div class="hero__visual" id="hero-visual"></div>
      </div>
    </section>

    <div class="marquee" id="marquee" aria-hidden="true"></div>

    <section class="work" id="work" aria-labelledby="work-title">
      <div class="container work__head">
        <div>
          <span class="section__label">Selected work</span>
          <h2 class="section__title" id="work-title">Things I've <em>built</em></h2>
        </div>
        <a class="btn btn--lg" href="projects.html">Quick review →</a>
      </div>
      <div class="container work__meta" aria-hidden="true">
        <span class="work__count">01 / 01</span>
        <span class="work__bar"><i></i></span>
      </div>
      <div class="work__viewport">
        <div class="work__track" id="work-track"></div>
      </div>
      <div class="work__end"></div>
    </section>

    <section class="section" id="about" aria-labelledby="about-title">
      <div class="container">
        <span class="section__label">About</span>
        <h2 class="sr-only" id="about-title">About</h2>
        <div class="about">
          <p class="about__statement" id="about-statement"></p>
          <div class="terminal" aria-hidden="true">
            <div class="terminal__bar"><i></i><i></i><i></i></div>
            <div class="terminal__body" id="terminal-body"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section" id="skills" aria-labelledby="skills-title">
      <div class="container">
        <span class="section__label">Toolbox</span>
        <h2 class="section__title" id="skills-title">Skills</h2>
        <div class="skills" id="skills-list"></div>
        <a class="btn btn--primary btn--lg" href="assets/resume.pdf" download data-magnetic hidden>Download resume</a> <!-- hidden for now -->

      </div>
    </section>

    <section class="section" id="contact" aria-labelledby="contact-title">
      <div class="container contact">
        <div>
          <span class="section__label">Contact</span>
          <h2 class="contact__title" id="contact-title">Let's build something <em>together.</em></h2>
          <a class="contact__email" data-site-href="email|mailto:" data-site="email" data-magnetic></a>
          <ul class="contact__links">
            <li><a data-site-href="github" rel="noopener">GitHub ↗</a></li>
          </ul>
        </div>

        <form class="form" id="contact-form" novalidate data-reveal>
          <div class="form__field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-error">
            <p class="form__error" id="name-error" aria-live="polite"></p>
          </div>
          <div class="form__field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
            <p class="form__error" id="email-error" aria-live="polite"></p>
          </div>
          <div class="form__field">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required aria-describedby="message-error"></textarea>
            <p class="form__error" id="message-error" aria-live="polite"></p>
          </div>
          <!-- Honeypot: hidden from people, filled by bots -->
          <div class="form__hp" aria-hidden="true">
            <label for="hp-check">Leave this field empty</label>
            <input id="hp-check" name="hp_check" type="text" tabindex="-1" autocomplete="off" data-lpignore="true" data-1p-ignore>
          </div>
          <button class="btn btn--primary btn--lg" type="submit">Send message</button>
          <p class="form__status" id="form-status" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">© 2026 <span data-site="name"></span></div>
  </footer>
</body>
</html>
